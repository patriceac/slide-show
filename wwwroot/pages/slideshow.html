<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176c5f">
  <title>Slide Show</title>
  <link rel="icon" href="/assets/darkroom-stage.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/slideshow.css?v=20260922-workflows">
</head>
<body>
  <main id="stage" class="stage">
    <div class="slide-viewport" aria-live="polite">
      <img id="slideImage" class="slide-frame" alt="">
      <img id="nextSlideImage" class="slide-frame" alt="">
    </div>
    <div id="emptyState" class="empty-state">
      <h1>Choose an image folder</h1>
      <p>Open the control center on this computer to pick a folder.</p>
      <div id="emptyOfflineLibrary" class="empty-offline-library" hidden></div>
    </div>
    <div id="chrome" class="chrome">
      <header class="top-bar">
        <button id="backLibrary" type="button">← Library</button>
        <div class="viewer-identity">
          <strong id="folderName">Slide Show</strong>
          <span id="positionText">0 / 0</span>
        </div>
      </header>
      <nav class="controls" aria-label="Slideshow controls">
        <button id="stageLibrary" class="icon-button" type="button" aria-label="Open library" title="Library" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h6l1.6 2H20v9H4z"></path></svg>
        </button>
        <button id="settingsToggle" class="icon-button" type="button" aria-label="Open playback settings" title="Settings" aria-expanded="false" aria-controls="settingsPanel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.97 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.52-1.03H3v-4h.08A1.7 1.7 0 0 0 4.6 8.97a1.7 1.7 0 0 0-.34-1.88l-.06-.06L7.03 4.2l.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 10 3.08V3h4v.08a1.7 1.7 0 0 0 1.03 1.52 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15z"></path></svg>
        </button>
        <button id="fullscreenToggle" class="icon-button" type="button" aria-label="Open full screen" title="Full screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M8 20H4v-4"></path></svg>
        </button>
      </nav>
      <nav class="playback-dock" aria-label="Playback controls">
        <button id="previousSlide" class="dock-button" type="button" aria-label="Previous image" title="Previous image">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
        </button>
        <button id="playbackToggle" class="dock-button primary" type="button" aria-label="Pause slideshow" title="Pause">
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7v10M15 7v10"></path></svg>
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5z"></path></svg>
        </button>
        <button id="nextSlide" class="dock-button" type="button" aria-label="Next image" title="Next image">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        </button>
      </nav>
    </div>
    <section id="settingsPanel" class="settings-panel" aria-labelledby="settingsTitle" hidden>
      <header class="drawer-heading">
        <div>
          <span>Slideshow</span>
          <h2 id="settingsTitle">Playback</h2>
        </div>
        <button id="settingsClose" class="icon-button" type="button" aria-label="Close playback settings" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
        </button>
      </header>
      <p id="timerText"></p>
      <p id="settingsScope" class="panel-label"></p>
      <label for="playbackOrder">Photo order</label>
      <select id="playbackOrder"><option value="shuffle">Shuffle</option><option value="name">File name (A–Z)</option><option value="date">Date modified (oldest first)</option></select>
      <button id="restartPlayback" type="button">Start from beginning</button>
      <div class="panel-controls" aria-label="Timer controls">
        <button id="slower" type="button">- 1 sec</button>
        <button id="faster" type="button">+ 1 sec</button>
      </div>
      <p class="panel-label">Image size</p>
      <div class="panel-controls" aria-label="Image size controls">
        <button id="fitMode" type="button">Show entire photo</button>
        <button id="fullMode" type="button">Fill screen (crops)</button>
      </div>
      <div id="switchFolderGroup" class="switch-folder-group" hidden>
        <p class="panel-label">Slideshow</p>
        <button id="switchFolder" class="wide-panel-button" type="button">Switch folder</button>
      </div>
      <div id="offlineGroup" class="offline-group">
        <p class="panel-label">Offline</p>
        <p id="offlineStatus">Encrypted offline copies stay on this device.</p>
        <div class="panel-controls">
          <button id="saveOffline" type="button">Save offline</button>
          <button id="openOffline" type="button">Library</button>
        </div>
        <div id="offlineManage" class="panel-controls" hidden>
          <button id="renameOffline" type="button">Rename</button>
          <button id="deleteOffline" type="button">Delete</button>
        </div>
        <div id="offlineProtection" class="panel-controls" hidden>
          <button id="pinOffline" type="button">Set PIN</button>
          <button id="removePinOffline" type="button">Remove PIN</button>
          <button id="lockOffline" type="button">Lock</button>
        </div>
      </div>
    </section>
    <div id="slideProgress" class="slide-progress" aria-hidden="true"><span></span></div>
    <div id="connectionNotice" class="connection-notice" role="status" hidden><span></span><button id="retryPlayback">Retry</button><button id="noticeLibrary">Library</button></div>
    <div id="tapFeedback" class="tap-feedback" aria-hidden="true" hidden></div>
    <div id="offlineModal" class="offline-modal" role="dialog" aria-modal="true" hidden></div>
  </main>
  <script type="module" src="/assets/slideshow.js?v=20260922-workflows"></script>
</body>
</html>
